<script type="text/markdown" data-help-name="cerebrumUltimate">
Talk to Cerebrum as you would in any chat: ask about your home, control devices or describe something you want done at a particular time.

## Start chatting

Click **Open Cerebrum Web Page** and open the conversation. If Telegram is already set up, you can also message the bot; send `/start` for a welcome message.

## Try asking

- “Which lights are on?”
- “Turn off the living room lights.”
- “Remind me to water the plants tomorrow at 6 pm.”
- “Turn off the garden lights every evening at 11 pm.”

Use your own words, including the room, device or time when needed. No special commands or code are required.

## During the conversation

If a detail is missing, Cerebrum asks a question: reply in the same chat. If it asks for confirmation before acting, follow the instructions to confirm or cancel.

You can only request actions supported by your connected devices and allowed by the settings. If you see “Thinking…”, wait for the reply.

Web chat and Telegram share your household information. If you use an online AI service, the data needed to answer you is sent to that service.
</script>
