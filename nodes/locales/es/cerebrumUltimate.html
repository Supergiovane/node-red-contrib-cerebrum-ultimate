<script type="text/markdown" data-help-name="cerebrumUltimate">
Habla con Cerebrum como en cualquier chat: pregunta por tu casa, pide que controle un dispositivo o describe algo que quieras hacer a una hora concreta.

## Empieza a chatear

Pulsa **Open Cerebrum Web Page** y abre la conversación. Si Telegram ya está configurado, también puedes escribir al bot; envía `/start` para recibir un mensaje de bienvenida.

## Prueba estas peticiones

- «¿Qué luces están encendidas?»
- «Apaga las luces del salón.»
- «Recuérdame regar las plantas mañana a las 18:00.»
- «Apaga las luces del jardín cada noche a las 23:00.»

Escribe con tus propias palabras e indica la habitación, el dispositivo o la hora cuando haga falta. No necesitas comandos especiales ni código.

## Durante la conversación

Si falta un detalle, Cerebrum te hace una pregunta: responde en el mismo chat. Si pide confirmación antes de actuar, sigue las indicaciones para confirmar o cancelar.

Solo puedes pedir acciones que admitan tus dispositivos conectados y que estén permitidas en los ajustes. Si aparece «Estoy pensando…», espera la respuesta.

El chat web y Telegram comparten la información de la casa. Si usas un servicio de IA en línea, los datos necesarios para responder se envían a ese servicio.
