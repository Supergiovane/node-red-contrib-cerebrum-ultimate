<script type="text/markdown" data-help-name="cerebrumUltimate">
Parlez à Cerebrum comme dans une conversation ordinaire : posez des questions sur la maison, demandez une action sur un appareil ou décrivez ce que vous souhaitez faire à une heure précise.

## Commencer une conversation

Cliquez sur **Open Cerebrum Web Page** et ouvrez la conversation. Si Telegram est déjà configuré, vous pouvez aussi écrire au bot ; envoyez `/start` pour recevoir un message de bienvenue.

## Essayez ces demandes

- « Quelles lumières sont allumées ? »
- « Éteins les lumières du salon. »
- « Rappelle-moi d’arroser les plantes demain à 18 h. »
- « Éteins les lumières du jardin tous les soirs à 23 h. »

Utilisez vos propres mots, en précisant la pièce, l’appareil ou l’heure si nécessaire. Aucun code ni commande spéciale n’est nécessaire.

## Pendant la conversation

S’il manque un détail, Cerebrum vous pose une question : répondez dans la même conversation. S’il demande une confirmation avant d’agir, suivez les indications pour confirmer ou annuler.

Les actions possibles dépendent de vos appareils connectés et des autorisations définies dans les réglages. Si « Je réfléchis… » s’affiche, attendez la réponse.

Le chat web et Telegram partagent les informations de la maison. Si vous utilisez un service d’IA en ligne, les données nécessaires à la réponse sont envoyées à ce service.
</script>
