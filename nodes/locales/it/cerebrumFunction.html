<script type="text/html" data-help-name="cerebrum-function">
    <p>In <b>On Message</b>, scrivi <code>cerebrum.</code> per scoprire le API di lettura. Con <code>cerebrum.knx.get("…")</code> e <code>cerebrum.knx.state("…")</code> scegli un indirizzo autorizzato per nome o numero, con dettagli DPT. <code>cerebrum.states.list()</code> elenca gli stati osservati delle integrazioni; <code>cerebrum.functions.list()</code> elenca le automazioni salvate e <code>cerebrum.functions.get(nome)</code> ne legge il codice. Non vengono chiamati modelli né azionati dispositivi. Controlla <code>cerebrum.available</code>, i risultati mancanti (<code>null</code>) e <code>fresh</code>/<code>verifiedAt</code> dello stato prima di usarne il valore. Le API funzionano anche in On Start/On Stop.</p>
    <p><b>Cerebrum Function</b> usa il runtime del Function nativo. Seleziona un Cerebrum già distribuito in <b>Setup</b>, poi descrivi il codice nella scheda <b>Cerebrum</b> e aggiungi un eventuale messaggio di esempio. Controlla la proposta e applicala agli editor, poi usa Done e Deploy. I messaggi normali eseguono il JavaScript salvato senza chiamate AI. Il catalogo ETS selezionato viene incluso automaticamente come riferimento, non come stato aggiornato. Prompt ed esempio sono salvati nel flow; richieste e risposte complete sono archiviate nella memoria Cerebrum. <code>node.linkcall</code> richiede Node-RED 5 o successivo.</p>
    <p><b>Cerebrum Function</b> uses the native Function runtime. Select a deployed Cerebrum in <b>Setup</b>, then describe the code in the <b>Cerebrum</b> tab and optionally provide an example message. Review the proposal and apply it to the editors, then use Done and Deploy. Normal messages run the saved JavaScript without AI calls. The selected ETS catalog is included automatically as reference data, not live state. Prompts and example messages are saved in the flow; full authoring turns are archived in Cerebrum memory. <code>node.linkcall</code> requires Node-RED 5 or later.</p>
    <p>A JavaScript function to run against the messages being received by the node.</p>
    <p>The messages are passed in as a JavaScript object called <code>msg</code>.</p>
    <p>By convention it will have a <code>msg.payload</code> property containing
       the body of the message.</p>
    <p>The function is expected to return a message object (or multiple message objects), but can choose
       to return nothing in order to halt a flow.</p>
    <p>The <b>On Start</b> tab contains code that will be run whenever the node is started.
        The <b>On Stop</b> tab contains code that will be run when the node is stopped.</p>
    <p>If the On Start code returns a Promise object, the node will not start handling messages
        until the promise is resolved.</p>
    <h3>Details</h3>
    <p>See the <a target="_blank" href="https://nodered.org/docs/writing-functions.html">online documentation</a>
    for more information on writing functions.</p>
    <h4>Sending messages</h4>
    <p>The function can either return the messages it wants to pass on to the next nodes
    in the flow, or can call <code>node.send(messages)</code>.</p>
    <p>It can return/send:</p>
    <ul>
      <li>a single message object - passed to nodes connected to the first output</li>
      <li>an array of message objects - passed to nodes connected to the corresponding outputs</li>
    </ul>
    <p>Note: The setup code is executed during the initialization of nodes. Therefore, if <code>node.send</code> is called in the setup tab, subsequent nodes may not be able to receive the message.</p>
    <p>If any element of the array is itself an array of messages, multiple
          messages are sent to the corresponding output.</p>
    <p>If null is returned, either by itself or as an element of the array, no
          message is passed on.</p>
    <h4>Logging and Error Handling</h4>
    <p>To log any information, or report an error, the following functions are available:</p>
      <ul>
          <li><code>node.log("Log message")</code></li>
          <li><code>node.warn("Warning")</code></li>
          <li><code>node.error("Error")</code></li>
      </ul>
    </p>
    <p>The Catch node can also be used to handle errors. To invoke a Catch node,
    pass <code>msg</code> as a second argument to <code>node.error</code>:</p>
    <pre>node.error("Error",msg);</pre>
    <h4>Accessing Node Information</h4>
    <p>The following properties are available to access information about the node:</p>
    <ul>
        <li><code>node.id</code> - id of the node</li>
        <li><code>node.name</code> - name of the node</li>
        <li><code>node.outputCount</code> - number of node outputs</li>
    </ul>
    <h4>Using environment variables</h4>
    <p>Environment variables can be accessed using <code>env.get("MY_ENV_VAR")</code>.</p>
</script>
