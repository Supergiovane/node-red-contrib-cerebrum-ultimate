<script type="text/markdown" data-help-name="cerebrumUltimate">
Parla con Cerebrum come in una normale chat: puoi fare domande sulla casa, chiedere di usare i dispositivi o descrivere qualcosa da fare a un certo orario.

## Inizia a chattare

Premi **Open Cerebrum Web Page** e apri la conversazione. Se Telegram è già configurato, puoi scrivere anche al bot; invia `/start` per ricevere un messaggio di benvenuto.

## Prova a chiedere

- «Quali luci sono accese?»
- «Spegni le luci del soggiorno.»
- «Ricordami di annaffiare le piante domani alle 18.»
- «Ogni sera alle 23 spegni le luci del giardino.»

Scrivi con parole tue, indicando la stanza, il dispositivo o l’orario quando serve. Non occorrono comandi speciali né codice.

## Durante la conversazione

Se manca un dettaglio, Cerebrum ti fa una domanda: rispondi nella stessa chat. Se ti chiede conferma prima di agire, segui le indicazioni per confermare o annullare.

Puoi chiedere solo azioni disponibili per i dispositivi collegati e consentite dalla configurazione. Se compare «Sto pensando…», attendi la risposta.

La chat web e Telegram condividono le informazioni della casa. Se usi un servizio AI online, i dati necessari alla risposta vengono inviati a quel servizio.
</script>
