<script type="text/markdown" data-help-name="cerebrumUltimate">
Sprich mit Cerebrum wie in einem normalen Chat: Stelle Fragen zu deinem Zuhause, bitte um die Steuerung von Geräten oder beschreibe, was zu einer bestimmten Uhrzeit passieren soll.

## Chat starten

Klicke auf **Open Cerebrum Web Page** und öffne das Gespräch. Wenn Telegram bereits eingerichtet ist, kannst du auch dem Bot schreiben. Sende `/start`, um eine Begrüßung zu erhalten.

## Probiere diese Wünsche aus

- „Welche Lampen sind an?“
- „Schalte die Wohnzimmerbeleuchtung aus.“
- „Erinnere mich morgen um 18 Uhr ans Blumengießen.“
- „Schalte die Gartenbeleuchtung jeden Abend um 23 Uhr aus.“

Schreibe mit deinen eigenen Worten. Nenne bei Bedarf den Raum, das Gerät oder die Uhrzeit. Du brauchst keine besonderen Befehle und keinen Code.

## Im Gespräch

Fehlt eine Angabe, fragt Cerebrum nach. Antworte im selben Chat. Bittet es vor einer Aktion um Bestätigung, folge den Hinweisen zum Bestätigen oder Abbrechen.

Möglich sind nur Aktionen, die deine verbundenen Geräte unterstützen und die Einstellungen erlauben. Wenn „Ich denke nach…“ erscheint, warte auf die Antwort.

Webchat und Telegram teilen die Informationen über dein Zuhause. Bei einem KI-Onlinedienst werden die für die Antwort benötigten Daten an diesen Dienst gesendet.
