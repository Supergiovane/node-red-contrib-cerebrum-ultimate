<script type="text/markdown" data-help-name="cerebrumUltimate">
像日常聊天一样与 Cerebrum 交流：询问家中情况、请它操作设备，或告诉它你希望在什么时间做什么。

## 开始聊天

点击 **Open Cerebrum Web Page**，打开对话。如果已经配置好 Telegram，也可以直接给机器人发消息；发送 `/start` 即可收到欢迎消息。

## 试着这样说

- “哪些灯还亮着？”
- “关闭客厅的灯。”
- “明天下午 6 点提醒我给植物浇水。”
- “每天晚上 11 点关闭花园的灯。”

用自己的话描述即可，需要时说明房间、设备或时间。不需要特殊命令，也不用编写代码。

## 对话过程中

如果缺少信息，Cerebrum 会向你提问，请在同一个聊天中回答。如果它在操作前要求确认，请按提示确认或取消。

可执行的操作取决于已连接的设备和设置中允许的权限。如果看到“正在思考…”，请等待回复。

网页聊天和 Telegram 共用家庭信息。如果使用在线 AI 服务，回答所需的数据会发送到该服务。
</script>
