<script type="text/javascript">
    RED.nodes.registerType('cerebrumUltimate', {
        category: "Cerebrum Ultimate",
        color: '#FF9800',
        defaults: {
            server: { value: "", type: "knxUltimate-config", required: false },
            unifiProtectConfig: { value: "", type: "unifi-protect-config", required: false },
            name: { value: "Cerebrum", required: false },
            topic: { value: "", required: false },

            historyRetentionDays: { value: 30, validate: function(v) { return Number.isInteger(Number(v)) && Number(v) >= 1 && Number(v) <= 36500; } },
            llmEnabled: { value: false },
            llmBackgroundMode: { value: "chat" },
            llmBackgroundIntervalMinutes: { value: 1440, validate: function(v) { return Number.isInteger(Number(v)) && Number(v) >= 1 && Number(v) <= 10080; } },
            llmProvider: { value: "openai_compat" },
            llmBaseUrl: { value: "https://api.openai.com/v1/responses" },
            llmModel: { value: "gpt-5.4" },
            llmReasoningEffort: { value: "default" },
            llmContextLength: { value: 0 },
            llmLocalContextTokens: { value: 0 },
            llmMaxContextKb: { value: 0 },
            llmAllowKnxCommands: { value: false },
            llmRequireCommandConfirmation: { value: true },
            llmAllowRuntimeCode: { value: false },
            etsExposedGAs: { value: [] },
            etsReadOnlyGAs: { value: [] },
            etsExposeConfigured: { value: false },
            webAccessEnabled: { value: true },
            webMaxCallsPerHour: { value: 40 },
            chatAdapterPreset: { value: "none" },
            chatInputCode: { value: "" },
            chatOutputCode: { value: "" }
        },
        credentials: {
            llmApiKey: { type: "password" }
        },
        inputs: 1,
        outputs: 6,
        outputLabels: function (i) {
            switch (i) {
                case 0: return this._('cerebrumUltimate.outputs.summary');
                case 1: return this._('cerebrumUltimate.outputs.anomalies');
                case 2: return this._('cerebrumUltimate.outputs.assistant');
                case 3: return this._('cerebrumUltimate.outputs.knxCommands');
                case 4: return this._('cerebrumUltimate.outputs.ttsUltimate');
                case 5: return this._('cerebrumUltimate.outputs.homeAssistant');
            }
        },
        icon: "cerebrum-brain.svg",
        label: function () {
            return (this.name || "Cerebrum");
        },
        paletteLabel: "Cerebrum",
        oneditprepare: function () {
            try { RED.sidebar.show("help"); } catch (error) { }
            const node = this;
            const savedKnxGatewayId = String(node.server || "").trim();
            const savedUnifiProtectConfigId = String(node.unifiProtectConfig || "").trim();
            const OPENAI_DEFAULT_RESPONSES_URL = "https://api.openai.com/v1/responses";
            const OLLAMA_DEFAULT_CHAT_URL = "http://localhost:11434/api/chat";
            const ANTHROPIC_DEFAULT_CHAT_URL = "https://api.anthropic.com/v1/messages";
            const LMSTUDIO_DEFAULT_CHAT_URL = "http://localhost:1234/v1/chat/completions";
            const OLLAMA_LIBRARY_URL = "https://ollama.com/library";
            const OPENAI_COMPAT_DEFAULT_MODELS = ["gpt-5.4", "gpt-4o-mini"];
            const OLLAMA_DEFAULT_MODEL = "llama3.1";
            const ANTHROPIC_DEFAULT_MODEL = "claude-opus-4-8";

            const mountTabSection = (mountSelector, sectionSelector) => {
                const $mount = $(mountSelector);
                const $section = $(sectionSelector);
                if ($mount.length && $section.length) $mount.append($section);
            };
            mountTabSection("#cerebrum-mount-assistant-setup", "#cerebrum-tab-llm-connection");
            mountTabSection("#cerebrum-mount-web-intelligence", "#cerebrum-tab-web-intelligence");
            mountTabSection("#cerebrum-mount-assistant-advanced", "#cerebrum-tab-advanced");
            mountTabSection("#cerebrum-mount-chat-adapter", "#cerebrum-tab-chat-adapter");
            mountTabSection("#cerebrum-mount-home-intelligence", "#cerebrum-tab-home-intelligence");
            $("#cerebrum-tabs").tabs({ active: 0 });

            const toggleLLM = () => {
                const enabled = $("#node-input-llmEnabled").is(":checked");
                $("#cerebrum-llm-connection-settings").toggle(enabled);
                $("#cerebrum-llm-advanced-settings").toggle(enabled);
            };
            $("#node-input-llmEnabled").on("change", toggleLLM);
            const toggleLlmInterval = () => $("#cerebrum-llm-interval-row").toggle($("#node-input-llmBackgroundMode").val() === "interval");
            $("#node-input-llmBackgroundMode").on("change", toggleLlmInterval);
            toggleLlmInterval();

            const toggleCommandConfirmation = () => {
                const enabled = $("#node-input-llmAllowKnxCommands").is(":checked");
                $("#cerebrum-command-confirmation-row").toggle(enabled);
            };
            $("#node-input-llmAllowKnxCommands").on("change", toggleCommandConfirmation);

            toggleLLM();
            toggleCommandConfirmation();

            const nodeId = node.id;
            const resolveAdminRoot = () => {
                const raw = (RED.settings && typeof RED.settings.httpAdminRoot === "string") ? RED.settings.httpAdminRoot : "/";
                const trimmed = String(raw || "/").trim();
                const configuredRoot = (trimmed === "" || trimmed === "/")
                    ? ""
                    : "/" + trimmed.replace(/^\/+|\/+$/g, "");
                try {
                    // Home Assistant exposes the Node-RED editor below a dynamic
                    // ingress prefix that is intentionally absent from httpAdminRoot.
                    // Preserve that prefix when opening Cerebrum in a new tab.
                    const currentPath = String(window.location.pathname || "");
                    const ingressMatch = currentPath.match(/^(.*\/api\/hassio_ingress\/[^/]+)(?:\/|$)/);
                    if (ingressMatch && ingressMatch[1]) return ingressMatch[1].replace(/\/+$/g, "");
                } catch (error) { }
                return configuredRoot;
            };
            const resolveAccessToken = () => {
                try {
                    const tokens = (RED.settings && typeof RED.settings.get === "function") ? RED.settings.get("auth-tokens") : null;
                    const token = tokens && typeof tokens.access_token === "string" ? tokens.access_token.trim() : "";
                    return token;
                } catch (error) {
                    return "";
                }
            };
            const t = (key, fallback) => {
                const value = RED._(key);
                if (!value || value === key) return fallback || "";
                return value;
            };

            let educationEditorOpen = true;
            let educationLoadRequest;
            let educationRevision;
            let educationSaving = false;
            let savedEducation = "";
            const $education = $("#cerebrum-ai-education-content");
            const $educationStatus = $("#cerebrum-ai-education-status");
            // Node-RED does not await oneditsave. Keep its original Done handler
            // and invoke it only after the file save succeeds. Replacing the
            // button also covers the editor's keyboard-triggered jQuery click.
            const $originalDone = $("#node-dialog-ok");
            const $educationDone = $originalDone.clone(false).button();
            const $educationTray = $originalDone.closest(".red-ui-tray");
            const $educationCancel = $educationTray.find("#node-dialog-cancel, #node-dialog-delete");
            const educationShade = document.getElementById("red-ui-editor-shade");
            $originalDone.before($educationDone).detach();
            const educationHeaders = () => {
                const token = resolveAccessToken();
                return token ? { Authorization: "Bearer " + token } : {};
            };
            const showEducationError = (xhr, notify) => {
                const message = xhr.status === 404
                    ? t("cerebrumUltimate.messages.aiEducationDeployFirst", "Deploy this node before editing AI Education.")
                    : xhr.status === 409
                        ? t("cerebrumUltimate.messages.aiEducationConflict", "The file has changed. Copy your changes, cancel and reopen the editor to load the latest version.")
                        : (xhr.responseJSON && xhr.responseJSON.error) || t("cerebrumUltimate.messages.aiEducationError", "Unable to read or save AI Education.");
                $educationStatus.text(message);
                if (notify) RED.notify(message, "error");
            };
            const applyEducationSnapshot = data => {
                educationRevision = data.revision;
                savedEducation = data.content;
                $education.val(savedEducation).prop("disabled", false);
            };
            const loadEducation = () => {
                educationRevision = undefined;
                $education.prop("disabled", true);
                $educationStatus.text(t("cerebrumUltimate.messages.aiEducationLoading", "Loading AI Education..."));
                educationLoadRequest = $.ajax({
                    url: resolveAdminRoot() + "/cerebrumUltimate/sidebar/ai-education",
                    data: { nodeId: nodeId }, dataType: "json", cache: false, headers: educationHeaders()
                }).done(data => {
                    if (!educationEditorOpen) return;
                    applyEducationSnapshot(data);
                    $educationStatus.text("");
                }).fail(xhr => {
                    if (educationEditorOpen) showEducationError(xhr);
                });
            };
            $education.on("input", () => {
                const changed = $education.val() !== savedEducation;
                $educationStatus.text(changed ? t("cerebrumUltimate.messages.aiEducationUnsaved", "Press Done to save your changes.") : "");
            });
            $educationDone.on("click", event => {
                event.preventDefault();
                if (!educationEditorOpen || educationSaving || $educationDone.hasClass("disabled")) return;
                const content = String($education.val() || "");
                if (!educationRevision || content === savedEducation) {
                    $originalDone.trigger("click");
                    return;
                }
                educationSaving = true;
                const cancelState = $educationCancel.toArray().map(button => ({
                    button: $(button), disabled: button.disabled, disabledClass: $(button).hasClass("disabled")
                }));
                const finishEducationSave = () => {
                    educationSaving = false;
                    $education.add($educationDone).prop("disabled", false);
                    cancelState.forEach(state => state.button.prop("disabled", state.disabled).toggleClass("disabled", state.disabledClass));
                };
                $education.add($educationDone).prop("disabled", true);
                $educationCancel.prop("disabled", true).addClass("disabled");
                $educationStatus.text(t("cerebrumUltimate.messages.aiEducationSaving", "Saving AI Education..."));
                $.ajax({
                    url: resolveAdminRoot() + "/cerebrumUltimate/sidebar/ai-education/save",
                    method: "POST", contentType: "application/json", dataType: "json", headers: educationHeaders(),
                    data: JSON.stringify({ nodeId: nodeId, content: content, revision: educationRevision })
                }).done(data => {
                    if (!educationEditorOpen) return;
                    applyEducationSnapshot(data);
                    finishEducationSave();
                    $originalDone.trigger("click");
                }).fail(xhr => {
                    if (!educationEditorOpen) return;
                    finishEducationSave();
                    showEducationError(xhr, true);
                });
            });
            // Clicking outside the tray also means Done in Node-RED, but bypasses
            // the button event. Apply the same save guard only for our top tray.
            const confirmEducationFromShade = event => {
                if (!educationEditorOpen || $(".red-ui-tray").last()[0] !== $educationTray[0]) return;
                event.preventDefault();
                event.stopImmediatePropagation();
                $educationDone.trigger("click");
            };
            if (educationShade) educationShade.addEventListener("click", confirmEducationFromShade, true);
            const destroyAiEducationEditor = () => {
                if (!educationEditorOpen) return;
                educationEditorOpen = false;
                if (educationLoadRequest) educationLoadRequest.abort();
                if (educationShade) educationShade.removeEventListener("click", confirmEducationFromShade, true);
                RED.events.off("editor:close", destroyAiEducationEditor);
                $educationDone.replaceWith($originalDone);
            };
            node._destroyAiEducationEditor = destroyAiEducationEditor;
            RED.events.on("editor:close", destroyAiEducationEditor);
            loadEducation();

            const applyChatEditorOptions = (editor) => {
                try {
                    if (!editor) return;
                    if (typeof editor.updateOptions === "function") {
                        editor.updateOptions({
                            lineNumbers: "off",
                            minimap: { enabled: false },
                            scrollbar: { verticalScrollbarSize: 8, horizontalScrollbarSize: 8 }
                        });
                    } else if (editor.renderer && typeof editor.renderer.setShowGutter === "function") {
                        editor.renderer.setShowGutter(false);
                    }
                    if (typeof editor.setShowPrintMargin === "function") editor.setShowPrintMargin(false);
                    if (typeof editor.setOptions === "function") {
                        editor.setOptions({
                            enableBasicAutocompletion: true,
                            enableLiveAutocompletion: true
                        });
                    }
                } catch (error) { }
            };
            const setChatEditorValue = (editor, value) => {
                try {
                    if (!editor) return;
                    if (typeof editor.setValue === "function") {
                        editor.setValue(String(value || ""));
                    } else if (editor.session && typeof editor.session.setValue === "function") {
                        editor.session.setValue(String(value || ""));
                    }
                } catch (error) { }
            };
            const destroyChatEditors = () => {
                modelEditorClosed = true;
                modelsRequestVersion++;
                localContextRequestVersion++;
                ["chatInputCodeEditor", "chatOutputCodeEditor"].forEach(function (key) {
                    try {
                        if (node[key] && typeof node[key].destroy === "function") node[key].destroy();
                    } catch (error) { }
                    delete node[key];
                });
                try {
                    const $model = $("#node-input-llmModel");
                    $model.off(".knxUltimateAiModelPicker");
                    if (typeof $model.autocomplete === "function" && $model.data("ui-autocomplete")) {
                        $model.autocomplete("destroy");
                    }
                } catch (error) { }
            };

            try {
                node.chatInputCodeEditor = RED.editor.createEditor({
                    id: "node-input-chatInputCode-editor",
                    mode: "ace/mode/nrjavascript",
                    value: node.chatInputCode || ""
                });
            } catch (error) { }
            try {
                node.chatOutputCodeEditor = RED.editor.createEditor({
                    id: "node-input-chatOutputCode-editor",
                    mode: "ace/mode/nrjavascript",
                    value: node.chatOutputCode || ""
                });
            } catch (error) { }
            applyChatEditorOptions(node.chatInputCodeEditor);
            applyChatEditorOptions(node.chatOutputCodeEditor);
            if (typeof monaco !== "undefined") {
                try {
                    const globalScope = typeof window !== "undefined" ? window : globalThis;
                    if (!globalScope._cerebrumChatEditorThemesDefined) {
                        monaco.editor.defineTheme("cerebrum-chat-input-theme", {
                            base: "vs",
                            inherit: true,
                            rules: [],
                            colors: {
                                "editor.background": "#e8f5e9",
                                "editorGutter.background": "#e8f5e9"
                            }
                        });
                        monaco.editor.defineTheme("cerebrum-chat-output-theme", {
                            base: "vs",
                            inherit: true,
                            rules: [],
                            colors: {
                                "editor.background": "#fffde7",
                                "editorGutter.background": "#fffde7"
                            }
                        });
                        globalScope._cerebrumChatEditorThemesDefined = true;
                    }
                    if (node.chatInputCodeEditor && typeof node.chatInputCodeEditor.updateOptions === "function") {
                        node.chatInputCodeEditor.updateOptions({ theme: "cerebrum-chat-input-theme" });
                    }
                    if (node.chatOutputCodeEditor && typeof node.chatOutputCodeEditor.updateOptions === "function") {
                        node.chatOutputCodeEditor.updateOptions({ theme: "cerebrum-chat-output-theme" });
                    }

                    const visible = rowDefinition.available() || !!entry;

                    if (!visible) return;

                    const configured = !!currentConfigId && currentConfigId !== "_ADD_";
                    const deployedConfigId = String(entry && entry.configNodeId || "").trim();
                    const used = !!entry && entry.usedInChat === true && configured && currentConfigId === deployedConfigId;

                    const cameraCount = Math.max(0, Number(entry && entry.cameraCount) || 0);
                    const detail = id === "unifi-ultimate"
                        ? t("cerebrumUltimate.messages.detectedAdapterControllers", "Controllers") + ": " + providerCount + " · " + t("cerebrumUltimate.messages.detectedAdapterCameras", "Cameras") + ": " + cameraCount

                const tokens = Math.max(0, Number(value) || 0);

            const renderChatContextOverview = (overview) => {

                if (!overview || typeof overview !== "object") {

                        .text(t("cerebrumUltimate.messages.chatContextUnavailable", "The Cerebrum context summary is temporarily unavailable."))
                        .show();

                    const $row = $("<div></div>").addClass("cerebrum-detected-adapter");

                const formatBytes = function (value) {
                    const bytes = Math.max(0, Number(value) || 0);
                    if (bytes >= (1024 * 1024)) return (bytes / (1024 * 1024)).toLocaleString(undefined, { maximumFractionDigits: 1 }) + " MB";
                    if (bytes >= 1024) return (bytes / 1024).toLocaleString(undefined, { maximumFractionDigits: 1 }) + " KB";
                    return bytes.toLocaleString() + " B";

                const contextLimit = overview.contextLimit && typeof overview.contextLimit === "object" ? overview.contextLimit : {};

                    ? Math.max(0, Number(contextLimit.tokens) || 0)
                    : 0;
                const localProvider = currentProvider === "lmstudio" || currentProvider === "ollama";
                if (localProvider) {
                    const modelContextTokens = contextLimitTokens || Math.max(0, Number($("#node-input-llmContextLength").val()) || 0);
                    const selectedTokens = selectedLocalContextTokens();
                    contextLimitTokens = selectedTokens > 0

                        : modelContextTokens;
                }
                const configuredContextKb = selectedMaxContextKb();
                if (configuredContextKb > 0 && contextLimitTokens > 0) {
                    contextLimitTokens = Math.min(contextLimitTokens, configuredContextKb * 1024);
                }
                const contextLimitValue = contextLimitTokens
                    ? formatCompactContextTokens(contextLimitTokens) + " " + t("cerebrumUltimate.messages.chatContextTokens", "tokens")
                    : t("cerebrumUltimate.messages.chatContextProviderManaged", "managed by the selected provider/model");
                const localBudgetValue = localProvider
                    ? " · " + t("cerebrumUltimate.messages.localContextBudget", "Local Cerebrum context") + ": " + selectedLocalContextLabel()
                    : "";
                $contextLimit
                    .text(t("cerebrumUltimate.messages.chatContextLimitLabel", "Maximum operational context") + ": " + contextLimitValue + localBudgetValue)
                    .attr("title", contextLimitTokens ? contextLimitTokens.toLocaleString() + " tokens" : contextLimitValue);

                const promptUsage = overview.lastPromptUsage && typeof overview.lastPromptUsage === "object" ? overview.lastPromptUsage : null;
                if (promptUsage && Number(promptUsage.bytes) > 0) {
                    const exactInputTokens = Math.max(0, Number(promptUsage.exactInputTokens) || 0);
                    const estimatedInputTokens = Math.max(0, Number(promptUsage.estimatedInputTokens) || 0);
                    const tokenText = exactInputTokens
                        ? formatCompactContextTokens(exactInputTokens) + " " + t("cerebrumUltimate.messages.chatContextExactInputTokens", "input tokens measured by the provider")
                        : "~" + formatCompactContextTokens(estimatedInputTokens) + " " + t("cerebrumUltimate.messages.chatContextEstimatedInputTokens", "estimated input tokens");
                    const imageText = Number(promptUsage.imageCount) > 0
                        ? " · " + Number(promptUsage.imageCount).toLocaleString() + " " + t("cerebrumUltimate.messages.chatContextImages", "images")
                        : "";
                    $lastPromptUsage.text(
                        t("cerebrumUltimate.messages.chatContextLastPromptLabel", "Last Cerebrum prompt actual size") + ": " +
                        formatBytes(promptUsage.bytes) + " · " + tokenText + imageText
                    );
                } else {
                    $lastPromptUsage.text(
                        t("cerebrumUltimate.messages.chatContextLastPromptLabel", "Last Cerebrum prompt actual size") + ": " +
                        t("cerebrumUltimate.messages.chatContextLastPromptUnavailable", "not available until the first Cerebrum request")
                    );
                }

                const sourceLabels = {
                    knxTraffic: t("cerebrumUltimate.messages.chatContextSourceKnxTraffic", "Derived KNX analysis plus the latest exact events from the default 20-minute or explicit interval, automatically bounded for the active local-model window."),
                    adapterHistory: t("cerebrumUltimate.messages.chatContextSourceAdapterHistory", "Latest exact adapter events from the same interval, automatically bounded for the active local-model window."),
                    etsProject: t("cerebrumUltimate.messages.chatContextSourceEtsProject", "Complete selected semantic ETS catalog for cloud models. Local models receive the full catalog when it fits; otherwise they receive a window-sized manifest and exact model-requested details. Function source only for explicit code review."),
                    memoryEducation: t("cerebrumUltimate.messages.chatContextSourceMemoryEducation", "Session context, AI Education, bounded home memory and active plans."),
                    cameras: t("cerebrumUltimate.messages.chatContextSourceCameras", "Detected cameras and their available capabilities.")
                };
                (Array.isArray(overview.sources) ? overview.sources : []).forEach(function (sourceId) {
                    addRow(
                        $sources,
                        sourceLabels[sourceId] || String(sourceId),
                        "",
                        "",
                        t("cerebrumUltimate.messages.chatContextSourceBadge", "Source")
                    );
                });

                const fileDescriptions = {
                    chatContext: t("cerebrumUltimate.messages.chatContextFileChatContext", "Persistent conversation turns, instructions and camera notification rules."),
                    homeMemory: t("cerebrumUltimate.messages.chatContextFileHomeMemory", "Bounded learned home memory, separate from user-managed AI Education."),
                    aiEducation: t("cerebrumUltimate.messages.chatContextFileAiEducation", "User-managed AI Education, loaded from its own file and included in backups."),
                    schedules: t("cerebrumUltimate.messages.chatContextFileSchedules", "Authoritative structured plans and reminders for this node."),
                    schedulesReadable: t("cerebrumUltimate.messages.chatContextFileSchedulesReadable", "Human-readable plans and reminders generated from the scheduler state."),
                    assistantConfig: t("cerebrumUltimate.messages.chatContextFileAssistantConfig", "Persistent Cerebrum configuration and semantic areas for this node."),
                    lastChatPrompt: t("cerebrumUltimate.messages.chatContextFileLastChatPrompt", "Temporary redacted local copy of the latest system and user messages sent to the Cerebrum model; transient camera-history evidence is omitted and the file is overwritten on every Cerebrum request.")
                };
                (Array.isArray(overview.files) ? overview.files : []).forEach(function (item) {
                    if (!item || !item.name || !item.path) return;
                    addRow(
                        $files,
                        item.name,
                        fileDescriptions[item.id] || "",
                        item.path,
                        t("cerebrumUltimate.messages.chatContextFileBadge", "File")
                    );
                });

                const directoryLabels = {
                    archiveRoot: t("cerebrumUltimate.messages.chatContextDirectoryRoot", "Telegram archive root"),
                    nodeArchive: t("cerebrumUltimate.messages.chatContextDirectoryNode", "This node's telegram archive"),
                    adapterArchiveRoot: t("cerebrumUltimate.messages.chatContextDirectoryAdapterRoot", "Adapter event archive root"),
                    adapterNodeArchive: t("cerebrumUltimate.messages.chatContextDirectoryAdapterNode", "This node's adapter event archive")
                };
                (Array.isArray(overview.telegramDirectories) ? overview.telegramDirectories : []).forEach(function (item) {
                    if (!item || !item.path) return;
                    addRow(
                        $directories,
                        directoryLabels[item.id] || String(item.id || ""),
                        "",
                        item.path,
                        /^adapter/.test(String(item.id || ""))
                            ? t("cerebrumUltimate.messages.chatContextDirectoryAdapterBadge", "Adapter")
                            : t("cerebrumUltimate.messages.chatContextDirectoryBadge", "KNX")
                    );
                });

                $("#cerebrum-chat-context-pattern")
                    .text(t("cerebrumUltimate.messages.chatContextTelegramPattern", "Daily files") + ": " + String(overview.telegramFilePattern || "YYYY-MM-DD.knxctx"));
                $status.hide();
                $content.show();
            };
            const loadCerebrumOverview = function () {
                const requestData = {};
                if (nodeId) requestData.nodeId = nodeId;
                $.ajax({
                    url: "cerebrumUltimate/adapters",
                    type: "GET",
                    data: requestData
                })
                    .done(function (data) {
                        renderDetectedAdapters(data && data.compatibleNodes);
                        renderChatContextOverview(data && data.chatContext);
                    })
                    .fail(function () {
                        $("#cerebrum-detected-adapters-status")
                            .text(t("cerebrumUltimate.messages.detectedAdaptersUnavailable", "Compatible-node detection is temporarily unavailable."))
                            .show();
                        renderChatContextOverview(null);
                    });
            };
            loadCerebrumOverview();

            const openCerebrumWebPage = function (view) {
                const adminRoot = resolveAdminRoot();
                const targetBase = adminRoot + "/cerebrumUltimate/sidebar/page";
                const params = new URLSearchParams();
                if (nodeId) params.set("nodeId", nodeId);
                if (view === "ets-access") {
                    params.set("tab", "etsAccess");
                }
                const accessToken = resolveAccessToken();
                if (accessToken) params.set("access_token", accessToken);
                const target = targetBase + (params.toString() ? ("?" + params.toString()) : "");
                const wnd = window.open(target, "_blank", "noopener,noreferrer");
                try { if (wnd && typeof wnd.focus === "function") wnd.focus(); } catch (e) { }
            };

            $("#cerebrum-open-web-page-vue").on("click", function (evt) {
                evt.preventDefault();
                openCerebrumWebPage();

            $("#cerebrum-open-ets-access").on("click", function (evt) {
                evt.preventDefault();

            });

            const setRefreshModelsBusy = (busy) => {
                const $button = $("#cerebrum-refreshModels");

                $button.find("i.fa-refresh").toggleClass("fa-spin", !!busy);
            };

            };

            let localModelDetailsById = new Map();

            let modelPickerMouseDown = false;
            let localContextRequestVersion = 0;
            let modelsRequestVersion = 0;
            let modelConnectionVersion = 0;
            let modelEditorClosed = false;

            const formatContextTokens = (value) => {
                const tokens = Math.max(0, Number(value) || 0);

            };

            const updateLocalContextTokenOptions = (detail) => {
                const $select = $("#node-input-llmLocalContextTokens");
                if (!$select.length) return;
                const maxContextLength = Math.max(0, Number(detail && detail.maxContextLength) || 0);
                $select.find("option[data-context-tokens]").each(function () {
                    const optionTokens = Math.max(0, Number($(this).attr("data-context-tokens")) || 0);
                    const unavailable = maxContextLength > 0 && optionTokens > maxContextLength;
                    $(this).prop("disabled", unavailable).prop("hidden", unavailable).toggle(!unavailable);
                });
                if (maxContextLength > 0 && selectedLocalContextTokens() > maxContextLength) {
                    $select.val("0");

                if (lastChatContextOverview) renderChatContextOverview(lastChatContextOverview);
            };

            const setLocalModelContextStatus = (detail, state, errorText) => {
                const $status = $("#cerebrum-local-context-status");
                const provider = $("#node-input-llmProvider").val();
                updateLocalContextTokenOptions(detail);
                if (!$status.length || (provider !== "lmstudio" && provider !== "ollama") || !detail) {
                    $status.hide();
                    return;
                }
                const maxTokens = formatContextTokens(detail.maxContextLength);
                const loadedTokens = formatContextTokens(detail.loadedContextLength);
                let text = t("cerebrumUltimate.messages.lmStudioContextAvailable", "Maximum model context") + ": " + maxTokens + " token";
                let color = "#555";
                if (state === "loading") {
                    text = t("cerebrumUltimate.messages.lmStudioContextLoading", "Checking the active model context") + "…";
                    color = "#1565c0";
                } else if (state === "inactive") {
                    text = t("cerebrumUltimate.messages.lmStudioContextInactive", "Model inactive; Bionic defaults will be used on the first request");
                    color = "#555";
                } else if (state === "configured") {
                    const configuredTokens = formatContextTokens(detail.configuredContextLength || detail.loadedContextLength || detail.maxContextLength);
                    text = t("cerebrumUltimate.messages.lmStudioContextConfigured", "Active model context") + ": " + configuredTokens + " token";
                    color = "#2e7d32";
                } else if (state === "error") {
                    text = String(errorText || t("cerebrumUltimate.messages.lmStudioContextFailed", "Unable to configure the model context"));
                    color = "#c62828";
                } else if (detail.loadedContextLength > 0) {
                    text += " · " + t("cerebrumUltimate.messages.lmStudioContextCurrentlyLoaded", "currently loaded") + ": " + loadedTokens + " token";
                }
                text += " · " + t("cerebrumUltimate.messages.localContextBudget", "Local Cerebrum context") + ": " + selectedLocalContextLabel();
                $status.text(text).css("color", color).show();
            };

            const populateModels = (models, modelDetails) => {
                localModelDetailsById = new Map();
                (modelDetails || []).forEach(function (detail) {
                    if (detail && detail.id) localModelDetailsById.set(String(detail.id), detail);
                });
                availableModelItems = (models || []).map(function (m) {
                    const detail = localModelDetailsById.get(String(m));
                    const label = detail
                        ? String(detail.displayName || detail.id) + " · " + formatContextTokens(detail.maxContextLength) + " token"
                        : String(m);
                    return { label: label, value: String(m) };

            const configureModelPicker = () => {

                        const term = String(request && request.term ? request.term : "").trim().toLowerCase();
                        if (!term) {
                            response(availableModelItems.slice());
                            return;
                        }
                        response(availableModelItems.filter(function (item) {
                            return item.value.toLowerCase().includes(term) || item.label.toLowerCase().includes(term);
                        }));
                    },
                    select: function (event, ui) {
                        $(this).val(ui.item.value).trigger("change");
                        return false;
                    }
                });
                $model.on("mousedown.knxUltimateAiModelPicker", function () {
                    modelPickerMouseDown = true;
                }).on("focus.knxUltimateAiModelPicker", function () {
                    if (!modelPickerMouseDown) $(this).autocomplete("search", "");
                }).on("click.knxUltimateAiModelPicker", function () {
                    modelPickerMouseDown = false;
                    const input = this;
                    setTimeout(function () {
                        try { $(input).autocomplete("search", ""); } catch (error) { }
                    }, 0);
                }).on("blur.knxUltimateAiModelPicker", function () {
                    modelPickerMouseDown = false;
                });
            };

            configureModelPicker();

            const normalizeUrl = (value) => String(value || "").trim().replace(/\/+$/, "").toLowerCase();
            const DEFAULT_CHAT_URLS = [OPENAI_DEFAULT_RESPONSES_URL, "https://api.openai.com/v1/chat/completions", OLLAMA_DEFAULT_CHAT_URL, ANTHROPIC_DEFAULT_CHAT_URL, LMSTUDIO_DEFAULT_CHAT_URL];
            const DEFAULT_MODELS = OPENAI_COMPAT_DEFAULT_MODELS.concat([OLLAMA_DEFAULT_MODEL, ANTHROPIC_DEFAULT_MODEL]);
            const isAnyDefaultUrl = (value) => DEFAULT_CHAT_URLS.some((u) => normalizeUrl(u) === normalizeUrl(value));
            const isAnyDefaultModel = (value) => DEFAULT_MODELS.indexOf(String(value || "").trim().toLowerCase()) >= 0;
            const urlByProvider = { ollama: OLLAMA_DEFAULT_CHAT_URL, anthropic: ANTHROPIC_DEFAULT_CHAT_URL, lmstudio: LMSTUDIO_DEFAULT_CHAT_URL, openai_compat: OPENAI_DEFAULT_RESPONSES_URL };
            const modelByProvider = { ollama: OLLAMA_DEFAULT_MODEL, anthropic: ANTHROPIC_DEFAULT_MODEL, lmstudio: "", openai_compat: OPENAI_COMPAT_DEFAULT_MODELS[0] };
            const providerSelections = new Map();
            let selectedProvider = String($("#node-input-llmProvider").val() || "openai_compat");

            const syncProviderEndpoint = (provider) => {
                const $baseUrl = $("#node-input-llmBaseUrl");
                let url = String($baseUrl.val() || "").trim();
                if (!url || isAnyDefaultUrl(url)) url = urlByProvider[provider] || OPENAI_DEFAULT_RESPONSES_URL;
                // Match the runtime's Responses routing on the official host.
                // Other hosts may be custom gateways serving any model family.
                if (provider === "openai_compat") {
                    try {
                        const parsed = new URL(url);
                        if (parsed.protocol === "https:" && parsed.hostname.toLowerCase() === "api.openai.com") {
                            parsed.pathname = "/v1/responses";
                            parsed.search = "";
                            parsed.hash = "";
                            url = parsed.toString();
                        }
                    } catch (error) { }
                }
                $baseUrl.val(url);
                return url;
            };

            const applyProviderDefaults = (provider) => {
                const $baseUrl = $("#node-input-llmBaseUrl");
                const $model = $("#node-input-llmModel");
                const currentModel = String($model.val() || "").trim();
                if (provider !== selectedProvider) {
                    // Keep custom hosts with their provider while this dialog is open.
                    providerSelections.set(selectedProvider, { baseUrl: String($baseUrl.val() || "").trim(), model: currentModel });
                    const saved = providerSelections.get(provider);
                    $baseUrl.val(saved ? saved.baseUrl : urlByProvider[provider]);
                    $model.val(saved ? saved.model : modelByProvider[provider]);
                    selectedProvider = provider;
                } else if (!currentModel || isAnyDefaultModel(currentModel)) {
                    $model.val(modelByProvider[provider]);
                }
                syncProviderEndpoint(provider);
            };

            const invalidateModelRequests = () => {
                modelsRequestVersion++;
                localContextRequestVersion++;
                modelConnectionVersion++;
                populateModels([], []);
                const $model = $("#node-input-llmModel");
                $model.prop("disabled", false);
                if (typeof $model.autocomplete === "function" && $model.data("ui-autocomplete")) $model.autocomplete("close");
                $("#node-input-llmContextLength").val(0);
                setRefreshModelsBusy(false);
                setOllamaInstallUiState(false);
                setLocalModelContextStatus(null);
            };

            const configureSelectedLocalModel = () => {
                const requestVersion = ++localContextRequestVersion;
                const provider = $("#node-input-llmProvider").val();
                if (provider !== "lmstudio" && provider !== "ollama") return;
                const model = String($("#node-input-llmModel").val() || "").trim();
                const detail = localModelDetailsById.get(model);
                if (!detail || !(Number(detail.maxContextLength) > 0)) {
                    $("#node-input-llmContextLength").val(0);
                    updateLocalContextTokenOptions(null);
                    setLocalModelContextStatus(null);
                    return;
                }

                const activeContextLength = Number(detail.loadedContextLength) > 0
                    ? Number(detail.loadedContextLength)
                    : Number(detail.maxContextLength);
                $("#node-input-llmContextLength").val(activeContextLength);
                if (provider === "ollama") {
                    detail.configuredContextLength = Number(detail.maxContextLength);
                    $("#node-input-llmContextLength").val(detail.configuredContextLength);
                    setLocalModelContextStatus(detail);
                    return;
                }

                setLocalModelContextStatus(detail, "loading");
                $("#node-input-llmModel").prop("disabled", true);
                $("#cerebrum-refreshModels").prop("disabled", true);

                const payload = {
                    nodeId: nodeId,
                    baseUrl: $("#node-input-llmBaseUrl").val() || LMSTUDIO_DEFAULT_CHAT_URL,
                    model: model,
                    localContextTokens: selectedLocalContextTokens()
                };
                const apiKey = $("#node-input-llmApiKey").val() || "";
                if (apiKey && apiKey !== "__PWRD__") payload.apiKey = apiKey;

                $.ajax({
                    url: "cerebrumUltimate/lmstudio/select-model",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(payload)
                })
                    .done(function (data) {
                        if (requestVersion !== localContextRequestVersion) return;
                        const resolvedContextLength = Math.max(0, Number(data && data.contextLength) || 0);
                        detail.loadedContextLength = data && data.active === true ? resolvedContextLength : 0;
                        detail.configuredContextLength = resolvedContextLength;
                        $("#node-input-llmContextLength").val(resolvedContextLength);
                        setLocalModelContextStatus(detail, data && data.active === true ? "configured" : "inactive");
                    })
                    .fail(function (xhr) {
                        if (requestVersion !== localContextRequestVersion) return;
                        let errorText = t("cerebrumUltimate.messages.lmStudioContextFailed", "Unable to configure the model context");
                        try {
                            if (xhr && xhr.responseJSON && xhr.responseJSON.error) errorText = xhr.responseJSON.error;
                        } catch (e) { }
                        setLocalModelContextStatus(detail, "error", errorText);
                        try { RED.notify(errorText, "error"); } catch (e) { }
                    })
                    .always(function () {
                        if (requestVersion !== localContextRequestVersion) return;
                        $("#node-input-llmModel").prop("disabled", false);
                        $("#cerebrum-refreshModels").prop("disabled", false);
                    });
            };

            const refreshModels = () => {
                if (modelEditorClosed) return;
                const requestVersion = ++modelsRequestVersion;
                const provider = $("#node-input-llmProvider").val();
                const baseUrl = syncProviderEndpoint(provider);
                const requestIsCurrent = () => !modelEditorClosed && requestVersion === modelsRequestVersion;
                const apiKey = $("#node-input-llmApiKey").val() || "";
                const payload = { nodeId: nodeId, provider: provider, baseUrl: baseUrl };
                if (provider === "ollama") payload.autoStart = true;
                // Node-RED uses "__PWRD__" as placeholder for stored credentials: don't send it.
                if (apiKey && apiKey !== "__PWRD__") payload.apiKey = apiKey;

                setRefreshModelsBusy(true);

                $.ajax({
                    url: "cerebrumUltimate/models",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(payload)
                })
                    .done(function (data) {
                        if (!requestIsCurrent()) return;
                        const models = (data && data.models) ? data.models : [];
                        populateModels(models, data && data.modelDetails);
                        let selectedAutomatically = false;
                        if (provider === "lmstudio" && models.length > 0 && !String($("#node-input-llmModel").val() || "").trim()) {
                            $("#node-input-llmModel").val(models[0]);
                            selectedAutomatically = true;
                        }
                        if (provider === "lmstudio" || provider === "ollama") {
                            const selectedDetail = localModelDetailsById.get(String($("#node-input-llmModel").val() || ""));
                            if (selectedDetail) {
                                setLocalModelContextStatus(selectedDetail);
                                configureSelectedLocalModel();
                            } else if (selectedAutomatically) {
                                configureSelectedLocalModel();
                            }
                        }
                        if (provider === "ollama" && data && data.ollamaStarted) {
                            try {
                                const startedMsg = t('cerebrumUltimate.messages.ollamaStartedAuto', "Ollama server started automatically.");
                                RED.notify(startedMsg, "success");
                            } catch (e) { }
                        }
                        if (provider === "ollama" && models.length === 0) {
                            const msg = t('cerebrumUltimate.messages.ollamaNoModels', "No local Ollama model found. Install one from https://ollama.com/library.");
                            try { RED.notify(msg, "warning"); } catch (e) { }
                        }
                    })
                    .fail(function (xhr) {
                        if (!requestIsCurrent()) return;
                        let err = "Failed to load models";
                        try {
                            const resp = xhr && xhr.responseJSON;
                            if (resp && resp.error) err = resp.error;
                        } catch (e) { }
                        try { RED.notify(err, "error"); } catch (e) { }
                    })
                    .always(function () {
                        if (!requestIsCurrent()) return;
                        setRefreshModelsBusy(false);
                    });
            };

            const installOllamaModel = () => {
                const provider = $("#node-input-llmProvider").val();
                if (modelEditorClosed || provider !== "ollama") return;
                const connectionVersion = modelConnectionVersion;
                const requestIsCurrent = () => !modelEditorClosed && connectionVersion === modelConnectionVersion;
                const baseUrl = syncProviderEndpoint(provider);
                const model = String($("#node-input-llmModel").val() || "").trim() || OLLAMA_DEFAULT_MODEL;
                const payload = { nodeId: nodeId, baseUrl: baseUrl, model: model };

                $("#cerebrum-refreshModels").prop("disabled", true);
                setOllamaInstallUiState(true);

                $.ajax({
                    url: "cerebrumUltimate/ollama/pull",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(payload)
                })
                    .done(function (data) {
                        if (!requestIsCurrent()) return;
                        try {
                            const okMsg = t('cerebrumUltimate.messages.installedOllamaModel', "Ollama model installed") + ": " + model;
                            RED.notify(okMsg, "success");
                            if (data && data.ollamaStarted) {
                                const startedMsg = t('cerebrumUltimate.messages.ollamaStartedAuto', "Ollama server started automatically.");
                                RED.notify(startedMsg, "success");
                            }
                        } catch (e) { }
                        refreshModels();
                    })
                    .fail(function (xhr) {
                        if (!requestIsCurrent()) return;
                        let err = t('cerebrumUltimate.messages.installOllamaModelFailed', "Failed to install Ollama model");
                        try {
                            const resp = xhr && xhr.responseJSON;
                            if (resp && resp.error) err = resp.error;
                        } catch (e) { }
                        try { RED.notify(err, "error"); } catch (e) { }
                        $("#cerebrum-refreshModels").prop("disabled", false);
                    })
                    .always(function () {
                        if (!requestIsCurrent()) return;
                        setOllamaInstallUiState(false);
                    });
            };

            const openOllamaLibrary = () => {
                const wnd = window.open(OLLAMA_LIBRARY_URL, "_blank", "noopener,noreferrer");
                try { if (wnd && typeof wnd.focus === "function") wnd.focus(); } catch (e) { }
            };

            const toggleProvider = ({ applyDefaults = false, autoLoadModels = false } = {}) => {
                const provider = $("#node-input-llmProvider").val();
                const localProvider = provider === "lmstudio" || provider === "ollama";
                if (applyDefaults) applyProviderDefaults(provider);
                $("#cerebrum-local-context-row").toggle(localProvider);
                if (localProvider) {
                    updateLocalContextTokenOptions(localModelDetailsById.get(String($("#node-input-llmModel").val() || "").trim()));
                }
                if (provider === "ollama") {
                    $("#cerebrum-apikey-row").hide();
                    $("#cerebrum-ollama-install-row").show();
                    if (autoLoadModels) refreshModels();
                } else {
                    $("#cerebrum-apikey-row").show();
                    $("#cerebrum-ollama-install-row").hide();
                    if (provider === "lmstudio" && autoLoadModels) refreshModels();
                    if (provider !== "lmstudio") {
                        $("#node-input-llmContextLength").val(0);
                        if (provider !== "ollama") $("#cerebrum-local-context-status").hide();
                    }
                }
            };
            const toggleWebAccess = () => {
                const enabled = $("#node-input-webAccessEnabled").prop("checked") === true;
                $("#cerebrum-web-access-settings").toggle(enabled);
            };
            $("#node-input-webAccessEnabled").on("change", toggleWebAccess);
            toggleWebAccess();
            $("#node-input-llmProvider").on("change", function () {
                invalidateModelRequests();
                toggleProvider({ applyDefaults: true, autoLoadModels: true });
            });
            toggleProvider({ applyDefaults: true });

            $("#cerebrum-refreshModels").on("click", function (evt) {
                evt.preventDefault();
                refreshModels();
            });
            $("#node-input-llmModel").on("change", function () {
                syncProviderEndpoint($("#node-input-llmProvider").val());
                configureSelectedLocalModel();
            });
            $("#node-input-llmBaseUrl").on("change", function () {
                syncProviderEndpoint($("#node-input-llmProvider").val());
                invalidateModelRequests();
            });
            $("#node-input-llmLocalContextTokens").on("change", function () {
                const detail = localModelDetailsById.get(String($("#node-input-llmModel").val() || "").trim());
                updateLocalContextTokenOptions(detail);
                if (detail) setLocalModelContextStatus(detail, detail.loadedContextLength > 0 ? "configured" : undefined);
            });
            $("#node-input-llmMaxContextKb").on("input change", function () {
                if (lastChatContextOverview) renderChatContextOverview(lastChatContextOverview);
            });
            $("#cerebrum-downloadOllamaModel").on("click", function (evt) {
                evt.preventDefault();
                openOllamaLibrary();
            });
            $("#cerebrum-installOllamaModel").on("click", function (evt) {
                evt.preventDefault();
                installOllamaModel();
            });
        },
        oneditsave: function () {
            try { RED.sidebar.show("info"); } catch (error) { }
            if (this._destroyAiEducationEditor) this._destroyAiEducationEditor();
            delete this._destroyAiEducationEditor;
            delete this.aiEducation;
            try {
                if (this.chatInputCodeEditor && typeof this.chatInputCodeEditor.getValue === "function") {
                    this.chatInputCode = this.chatInputCodeEditor.getValue();
                    $("#node-input-chatInputCode").val(this.chatInputCode);
                }
            } catch (error) { }
            try {
                if (this.chatOutputCodeEditor && typeof this.chatOutputCodeEditor.getValue === "function") {
                    this.chatOutputCode = this.chatOutputCodeEditor.getValue();
                    $("#node-input-chatOutputCode").val(this.chatOutputCode);
                }
            } catch (error) { }
            try {
                if (typeof this._destroyCerebrumChatEditors === "function") this._destroyCerebrumChatEditors();
            } catch (error) { }
            delete this._destroyCerebrumChatEditors;
        },
        oneditcancel: function () {
            try { RED.sidebar.show("info"); } catch (error) { }
            if (this._destroyAiEducationEditor) this._destroyAiEducationEditor();
            delete this._destroyAiEducationEditor;
            try {
                if (typeof this._destroyCerebrumChatEditors === "function") this._destroyCerebrumChatEditors();
            } catch (error) { }
            delete this._destroyCerebrumChatEditors;
        },
        oneditresize: function () {
            try {
                if (this.chatInputCodeEditor && typeof this.chatInputCodeEditor.resize === "function") this.chatInputCodeEditor.resize();
                if (this.chatOutputCodeEditor && typeof this.chatOutputCodeEditor.resize === "function") this.chatOutputCodeEditor.resize();
            } catch (error) { }
        }
    })
</script>

            <div id="cerebrum-chat-context-panel">

            <div class="form-row">

            <div id="cerebrum-llm-connection-settings">
                <div class="form-row">
                    <label  for="node-input-llmProvider"><i class="fa fa-cog"></i> <span data-i18n="cerebrumUltimate.properties.llmProvider"></span></label>

                        <option value="anthropic" data-i18n="cerebrumUltimate.selectlists.llmProvider.anthropic"></option>
                        <option value="ollama" data-i18n="cerebrumUltimate.selectlists.llmProvider.ollama"></option>
                        <option value="lmstudio" data-i18n="cerebrumUltimate.selectlists.llmProvider.lmstudio"></option>
                    </select>

                <div class="form-row" id="cerebrum-apikey-row">

                    <input type="password" id="node-input-llmApiKey" data-i18n="[placeholder]cerebrumUltimate.placeholder.llmApiKey">
                </div>

                <div class="form-row">
                    <label  for="node-input-llmModel"><i class="fa fa-cube"></i> <span data-i18n="cerebrumUltimate.properties.llmModel"></span></label>
                    <input style="width:150px" type="text" id="node-input-llmModel" autocomplete="off" data-i18n="[placeholder]cerebrumUltimate.placeholder.llmModel">
                    <button type="button" class="red-ui-button" id="cerebrum-refreshModels" style="margin-left:6px;" title="Refresh models">
                        <i class="fa fa-refresh"></i> <span data-i18n="cerebrumUltimate.buttons.refreshModels"></span>
                    </button>
                </div>
                <div class="form-row">
                    <label  for="node-input-llmReasoningEffort"><i class="fa fa-tachometer"></i> <span data-i18n="cerebrumUltimate.properties.llmReasoningEffort"></span></label>
                    <select style="width:200px" id="node-input-llmReasoningEffort">
                        <option value="default" data-i18n="cerebrumUltimate.selectlists.reasoningEffort.default"></option>
                        <option value="none" data-i18n="cerebrumUltimate.selectlists.reasoningEffort.none"></option>
                        <option value="minimal" data-i18n="cerebrumUltimate.selectlists.reasoningEffort.minimal"></option>
                        <option value="low" data-i18n="cerebrumUltimate.selectlists.reasoningEffort.low"></option>
                        <option value="medium" data-i18n="cerebrumUltimate.selectlists.reasoningEffort.medium"></option>
                        <option value="high" data-i18n="cerebrumUltimate.selectlists.reasoningEffort.high"></option>
                        <option value="xhigh" data-i18n="cerebrumUltimate.selectlists.reasoningEffort.xhigh"></option>
                        <option value="max" data-i18n="cerebrumUltimate.selectlists.reasoningEffort.max"></option>
                    </select>
                    <div class="cerebrum-prompt-context-hint" data-i18n="cerebrumUltimate.messages.reasoningEffortHint"></div>
                </div>
                <div class="form-row">
                    <label  for="node-input-llmMaxContextKb"><i class="fa fa-database"></i> <span data-i18n="cerebrumUltimate.properties.llmMaxContextKb"></span></label>
                    <input style="width:100px" type="number" id="node-input-llmMaxContextKb" min="0" step="1">
                    <div class="cerebrum-prompt-context-hint" data-i18n="cerebrumUltimate.messages.maxContextKbHint"></div>
                </div>
                <div class="form-row">
                    <label for="node-input-llmBackgroundMode"><i class="fa fa-clock-o"></i> <span data-i18n="cerebrumUltimate.properties.llmBackgroundMode"></span></label>
                    <select id="node-input-llmBackgroundMode" style="width:65%">
                        <option value="chat" data-i18n="cerebrumUltimate.messages.llmModeChat"></option>
                        <option value="interval" data-i18n="cerebrumUltimate.messages.llmModeInterval"></option>
                    </select>
                </div>
                <div class="form-row" id="cerebrum-llm-interval-row">
                    <label for="node-input-llmBackgroundIntervalMinutes"><i class="fa fa-clock-o"></i> <span data-i18n="cerebrumUltimate.properties.llmBackgroundIntervalMinutes"></span></label>
                    <input id="node-input-llmBackgroundIntervalMinutes" type="number" min="1" max="10080" step="1" list="cerebrum-llm-intervals" style="width:120px">
                    <datalist id="cerebrum-llm-intervals"><option value="60">1 h</option><option value="360">6 h</option><option value="1440">1 d</option><option value="10080">7 d</option></datalist>
                </div>
                <div class="cerebrum-prompt-context-hint" data-i18n="cerebrumUltimate.messages.llmPolicyHint"></div>
                <input type="hidden" id="node-input-llmContextLength">
                <div id="cerebrum-local-context-status" style="display:none;"></div>
                <div class="form-row" id="cerebrum-local-context-row" style="display:none;">
                    <label  for="node-input-llmLocalContextTokens"><i class="fa fa-database"></i> <span data-i18n="cerebrumUltimate.properties.llmLocalContextTokens"></span></label>
                    <select style="width:200px" id="node-input-llmLocalContextTokens">
                        <option value="0" data-i18n="cerebrumUltimate.selectlists.localContext.maximum"></option>
                        <option value="4096" data-context-tokens="4096" data-i18n="cerebrumUltimate.selectlists.localContext.k4"></option>
                        <option value="8192" data-context-tokens="8192" data-i18n="cerebrumUltimate.selectlists.localContext.k8"></option>
                        <option value="16384" data-context-tokens="16384" data-i18n="cerebrumUltimate.selectlists.localContext.k16"></option>
                        <option value="32768" data-context-tokens="32768" data-i18n="cerebrumUltimate.selectlists.localContext.k32"></option>
                        <option value="65536" data-context-tokens="65536" data-i18n="cerebrumUltimate.selectlists.localContext.k64"></option>
                        <option value="131072" data-context-tokens="131072" data-i18n="cerebrumUltimate.selectlists.localContext.k128"></option>
                        <option value="262144" data-context-tokens="262144" data-i18n="cerebrumUltimate.selectlists.localContext.k256"></option>
                    </select>
                    <div class="cerebrum-prompt-context-hint" data-i18n="cerebrumUltimate.messages.localContextHint"></div>
                </div>
                <div class="form-row">
                    <input type="checkbox" id="node-input-llmAllowKnxCommands" style="display:inline-block; width:auto; vertical-align:top;">
                    <label style="width:auto" for="node-input-llmAllowKnxCommands">&nbsp;&nbsp;<span data-i18n="cerebrumUltimate.properties.llmAllowKnxCommands"></span></label>
                </div>
                <div class="form-row" id="cerebrum-command-confirmation-row">
                    <input type="checkbox" id="node-input-llmRequireCommandConfirmation" style="display:inline-block; width:auto; vertical-align:top;">
                    <label style="width:auto" for="node-input-llmRequireCommandConfirmation">&nbsp;&nbsp;<span data-i18n="cerebrumUltimate.properties.llmRequireCommandConfirmation"></span></label>
                </div>
            </div>
        </div>

        <div id="cerebrum-tab-chat-adapter">
            <div class="form-row">
                <label  for="node-input-chatAdapterPreset"><i class="fa fa-plug"></i> <span data-i18n="cerebrumUltimate.properties.chatAdapterPreset"></span></label>
                <select style="width:200px" id="node-input-chatAdapterPreset">
                    <option value="none" data-i18n="cerebrumUltimate.selectlists.chatAdapter.none"></option>
                </select>
            </div>
            <div id="cerebrum-chat-adapter-fields" style="display:none;">
                <div class="form-row">
                    <label  for="node-input-chatInputCode"><i class="fa fa-sign-in"></i> <span data-i18n="cerebrumUltimate.properties.chatInputCode"></span></label>
                    <input type="hidden" id="node-input-chatInputCode">
                    <div id="node-input-chatInputCode-editor" class="node-text-editor cerebrum-chat-adapter-editor"></div>
                </div>
                <div class="form-row">
                    <label  for="node-input-chatOutputCode"><i class="fa fa-sign-out"></i> <span data-i18n="cerebrumUltimate.properties.chatOutputCode"></span></label>
                    <input type="hidden" id="node-input-chatOutputCode">
                    <div id="node-input-chatOutputCode-editor" class="node-text-editor cerebrum-chat-adapter-editor"></div>
                </div>
            </div>
        </div>

        <div id="cerebrum-tab-home-intelligence">
            <div class="form-row">
                <p data-i18n="cerebrumUltimate.messages.homeIntelligenceIntro"></p>
            </div>
            <div class="form-row">
                <label style="width:290px" for="cerebrum-ai-education-content"><i class="fa fa-graduation-cap"></i> <span data-i18n="cerebrumUltimate.properties.aiEducation"></span></label>
                <textarea id="cerebrum-ai-education-content" maxlength="16000" disabled style="width:100%; min-height:180px; box-sizing:border-box;" data-i18n="[placeholder]cerebrumUltimate.placeholder.aiEducation"></textarea>
                <div class="cerebrum-prompt-context-hint" data-i18n="cerebrumUltimate.messages.aiEducationFileHelp"></div>
                <div id="cerebrum-ai-education-status" role="status" aria-live="polite" class="cerebrum-prompt-context-hint"></div>
            </div>

        </div>

        <div id="cerebrum-tab-web-intelligence">
            <div class="form-row">
                <input type="checkbox" id="node-input-webAccessEnabled" style="display:inline-block; width:auto; vertical-align:top;">
                <label style="width:auto" for="node-input-webAccessEnabled">&nbsp;&nbsp;<span data-i18n="cerebrumUltimate.properties.webAccessEnabled"></span></label>
                <!-- <div class="cerebrum-prompt-context-hint" data-i18n="cerebrumUltimate.messages.webAccessHint"></div> -->
            </div>
            <div id="cerebrum-web-access-settings">
                <div class="form-row">
                    <label  for="node-input-webMaxCallsPerHour"><i class="fa fa-tachometer"></i> <span data-i18n="cerebrumUltimate.properties.webMaxCallsPerHour"></span></label>
                    <input type="number" id="node-input-webMaxCallsPerHour" min="1" max="60" step="1" style="width:100px;">
                    <!-- <div class="cerebrum-prompt-context-hint" data-i18n="cerebrumUltimate.messages.webBudgetHint"></div> -->
                </div>
            </div>
        </div>

        <div id="cerebrum-tab-advanced">
            <div id="cerebrum-llm-advanced-settings">
                <div class="form-row">
                    <input type="checkbox" id="node-input-llmAllowRuntimeCode" style="display:inline-block; width:auto; vertical-align:top;">
                    <label style="width:auto" for="node-input-llmAllowRuntimeCode">&nbsp;&nbsp;<span data-i18n="cerebrumUltimate.properties.llmAllowRuntimeCode"></span></label>
                    <div class="cerebrum-prompt-context-hint" data-i18n="cerebrumUltimate.messages.runtimeCodeHint"></div>
                </div>
                <div class="form-row">
                    <label  for="node-input-llmBaseUrl"><i class="fa fa-link"></i> <span data-i18n="cerebrumUltimate.properties.llmBaseUrl"></span></label>
                    <input type="text" id="node-input-llmBaseUrl" data-i18n="[placeholder]cerebrumUltimate.placeholder.llmBaseUrl">
                </div>
                <div class="form-row" id="cerebrum-ollama-install-row" style="display:none;">
                    <label ><i class="fa fa-download"></i> Ollama</label>
                    <div class="cerebrum-ollama-actions">
                        <button type="button" class="red-ui-button" id="cerebrum-downloadOllamaModel">
                            <i class="fa fa-cloud-download"></i> <span data-i18n="cerebrumUltimate.buttons.downloadOllamaModel"></span>
                        </button>
                        <button type="button" class="red-ui-button" id="cerebrum-installOllamaModel">
                            <i class="fa fa-download"></i> <span data-i18n="cerebrumUltimate.buttons.installOllamaModel"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>
